<!doctype html>
<html lang="fr">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="robots" content="noindex, nofollow" />
		<title>Administration — zalia sékaï</title>
	</head>
	<body>
		<!-- Sveltia CMS : éditeur en ligne façon WordPress, publie sur GitHub.

		     ⚠️ LA VERSION EST ÉPINGLÉE, NE PAS LA REMETTRE EN « latest ».
		     Sveltia est en 0.x et publie plusieurs versions par semaine (743 à ce
		     jour). Sans numéro de version, Zalia recevait une version différente
		     et non testée à chaque ouverture de /admin — cause probable des
		     « l'admin ne marche plus » inexpliqués.

		     0.221.4 est la version avec laquelle les dernières publications ont
		     abouti (26-27 septembre 2026).

		     POUR METTRE À JOUR, délibérément et en testant :
		       1) choisir la version sur https://www.npmjs.com/package/@sveltia/cms
		       2) calculer son empreinte :
		          curl -s https://unpkg.com/@sveltia/cms@X.Y.Z/dist/sveltia-cms.js \
		            | openssl dgst -sha384 -binary | openssl base64 -A
		       3) remplacer le numéro ET l'attribut integrity ci-dessous
		       4) tester une publication avant de laisser Zalia s'en servir
		     (Si integrity ne correspond pas au fichier, le navigateur refuse de
		      charger le script : l'admin reste blanche. C'est voulu — ça protège
		      le token GitHub d'un script CDN altéré.) -->
		<script
			src="https://unpkg.com/@sveltia/cms@0.221.4/dist/sveltia-cms.js"
			integrity="sha384-QAQzGwQRNWlCXEzHZ3+vg02kLIopQVLbS271gmQWo8QQtCKfi8Hwt4pamrnFyj24"
			crossorigin="anonymous"
		></script>

		<!-- ================================================================
		     Masque le bouton « Se connecter avec GitHub ».

		     POURQUOI : ce bouton délègue la connexion au service OAuth de
		     Netlify, et aucun fournisseur GitHub n'y est installé pour ce
		     site — https://api.netlify.com/auth?provider=github&site_id=…
		     répond 404. Le bouton est le plus visible des deux (bleu plein),
		     et cliquer dessus laisse la page figée sur « Connexion… »
		     indéfiniment. Zalia en conclut que l'admin est cassée.

		     Tant que l'OAuth n'est pas installé, on ne laisse que le chemin
		     qui fonctionne : la connexion par jeton d'accès.

		     POUR LE RÉTABLIR (après avoir installé le fournisseur OAuth dans
		     Netlify → Site configuration → Access & security → OAuth) :
		     supprimer tout ce bloc <script>.

		     Le repli est sûr : si la structure de Sveltia change et que rien
		     ne correspond, on ne masque rien et les deux boutons restent.
		     ============================================================= -->
		<script>
			(() => {
				const estJeton = (b) => /jeton|token/i.test(b.textContent || '');

				const nettoyer = () => {
					for (const groupe of document.querySelectorAll('div')) {
						const boutons = [...groupe.children].filter((e) => e.tagName === 'BUTTON');
						// On n'agit que sur l'écran de connexion : exactement deux
						// boutons côte à côte, dont celui du jeton.
						if (boutons.length !== 2 || !boutons.some(estJeton)) continue;
						for (const b of boutons) {
							if (estJeton(b)) continue;
							if (b.dataset.masque) continue;
							b.dataset.masque = '1';
							b.hidden = true;
						}
					}
				};

				nettoyer();
				new MutationObserver(nettoyer).observe(document.body, {
					childList: true,
					subtree: true,
				});
			})();
		</script>
	</body>
</html>
