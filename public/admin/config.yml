# --- Configuration Sveltia CMS (éditeur en ligne façon WordPress) ---
# À COMPLÉTER une fois le dépôt GitHub créé : remplacer OWNER/REPO ci-dessous
# par le nom réel du dépôt (ex. zaliasekai/site). C'est la seule ligne à changer
# pour activer l'édition en ligne.

backend:
  name: github
  repo: OWNER/REPO
  branch: main

# Permet de tester l'admin EN LOCAL sans GitHub :
#   1) lancer le site :        npx astro dev
#   2) lancer le proxy local : npx @sveltia/cms-proxy-server
#   3) ouvrir : http://localhost:4321/admin/
local_backend: true

# Langue de l'interface
locale: fr

# Où sont rangées les images téléversées, et comment elles sont écrites dans les
# articles (chemin relatif attendu par Astro : ./images/mon-image.jpg)
media_folder: "src/content/blog/images"
public_folder: "/src/content/blog/images"

collections:
  - name: blog
    label: "Articles"
    label_singular: "Article"
    description: "Ajouter, modifier ou supprimer un texte. Choisir la rubrique (placement) et l'ordre."
    folder: "src/content/blog"
    create: true
    delete: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    # Tri par défaut dans la liste
    sortable_fields: [pubDate, title]
    fields:
      # ---------- HÉRO ----------
      - { name: title, label: "Titre (héro)", widget: string, hint: "Grand titre affiché en haut de l'article." }

      - name: heroImage
        label: "Image (héro)"
        widget: image
        required: false
        hint: "Facultatif. Image de couverture affichée à côté du titre."

      - name: pubDate
        label: "Date"
        widget: datetime
        format: "YYYY-MM-DD"
        date_format: "DD/MM/YYYY"
        time_format: false

      - name: showDate
        label: "Afficher la date"
        widget: boolean
        default: true
        hint: "Décocher pour masquer la date sur l'article."

      # ---------- PLACEMENT ----------
      - name: category
        label: "Rubrique (placement)"
        widget: select
        default: essai
        hint: "Détermine où l'article apparaît dans le menu et la barre latérale."
        options:
          - { label: "Essai", value: essai }
          - { label: "Théâtre", value: theatre }
          - { label: "Récit", value: recit }
          - { label: "Actualités", value: actualites }
          - { label: "Interventions", value: interventions }
          - { label: "Revue de presse", value: revue-de-presse }
          - { label: "Articles (sélection)", value: article }
          - { label: "Vidéos (sélection)", value: videos }
          - { label: "Page (hors menu)", value: page }

      - name: video
        label: "Vidéo YouTube (identifiant)"
        widget: string
        required: false
        hint: "Facultatif. Ex. : 2swt5PT8a5U (l'identifiant après ?v= dans l'URL YouTube)."

      # ---------- CHAPEAU ----------
      - name: description
        label: "Chapeau (résumé en tête)"
        widget: markdown
        required: false
        minimal: true
        buttons: [bold, italic, quote]
        editor_components: []
        hint: "Court paragraphe d'introduction, affiché en italique sous le titre."

      # ---------- CORPS DU TEXTE ----------
      - name: body
        label: "Corps du texte"
        widget: markdown
        hint: "Le texte complet de l'article. Barre d'outils : gras, italique, titres, listes, citation, lien, image."
        buttons: [bold, italic, heading-two, heading-three, quote, bulleted-list, numbered-list, link, image]
